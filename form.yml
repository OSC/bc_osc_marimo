---
cluster:
  - "ascend"
  - "cardinal"
  - "pitzer"
form:
  - auto_modules_app_marimo
  - auto_accounts
  - global_job_type
  - global_enable_mem
  - global_num_cores
  - global_mem
  - bc_num_hours
  - global_gpus
  - global_gpu_type
  - auto_modules_cuda         # optional: include if users require different CUDA runtime for the app
  - global_enable_debug
  - global_default_values     # required if the global_job_type is used
  - working_dir
  - custom_venv
  - venv
  - sandbox
attributes:
  auto_modules_app_marimo:
    label: "Marimo version"
    default: false
  auto_modules_cuda:
    default: false
  working_dir:
    widget: "path_selector"
    label: "Working Directory or Notebook"
    data-target-file-type: both  # Valid values are: files, dirs, or both
    readonly: false
    help: "Select your notebook or project directory; defaults to $HOME"
  custom_venv:
    widget: "check_box"
    label: "Use custom virtual environment"
    value: 0
    html_options:
      data:
        hide-venv-when-checked: false
        hide-venv-when-un-checked: true
    help: "If specified, the selected virtual environment will be used instead of the system installation. If marimo is not already installed in the environment, it will be installed at startup. Specify the path to the virtual environment or to the /bin/activate script."
  venv:
    widget: "path_selector"
    hide_by_default: true
    label: "Virtual Environment"
    data-target-file-type: both
    readonly: false
    show_hidden: false
  sandbox:
    widget: "check_box"
    label: "Sandbox environment"
    value: 0
    help: "If a notebook is specified, it will be launched in sandbox mode. This has no effect when launching a working directory."
